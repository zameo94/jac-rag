[project]
name = "jac-rag_backend"
version = "0.1.0"
description = "SaaS RAG multi-tenant"
authors = [
    {name = "matteo", email = "matdeliperi.md@gmail.com"}
]
requires-python = ">=3.12,<4"
dependencies = [
    # Web Framework & Server
    "fastapi[standard]>=0.115.0",
    
    # Database & Migrations
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",

    # Configuration
    "pydantic-settings>=2.6.0",
    
    # Autenticazione & Sicurezza (JWT + Hashing password)
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    
    # Utility & Form handling (necessari per i file upload nel CMS)
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    
    # Background Tasks
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.2",
    
    # Tests
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.0",
    "aiosqlite>=0.20.0",
    "fastembed (>=0.8.0,<0.9.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "pdfplumber (>=0.11.0,<0.12.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "reportlab (>=5.0.1,<6.0.0)"
]
