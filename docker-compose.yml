services:
  db:
    image: postgres:16-alpine
    container_name: jac_rag_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      TZ: ${TZ:?set TZ in .env}
    ports:
      - "${DB_PORT:?set DB_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?} -d ${DB_NAME:?}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jac_rag_qdrant
    restart: always
    ports:
      - "${QDRANT_PORT:?set QDRANT_PORT in .env}:6333"
      - "${QDRANT_GRPC_PORT:?set QDRANT_GRPC_PORT in .env}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: jac_rag_redis
    restart: always
    ports:
      - "${REDIS_PORT:?set REDIS_PORT in .env}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: jac_rag_ollama
    restart: always
    ports:
      - "${OLLAMA_PORT:?set OLLAMA_PORT in .env}:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    container_name: jac_rag_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:?}:${DB_PASSWORD:?}@db:5432/${DB_NAME:?}
      - DB_POOL_SIZE=${DB_POOL_SIZE:?}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:?}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:?}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/data/storage
      - FASTEMBED_CACHE_PATH=/data/fastembed
      - ENVIRONMENT=${ENVIRONMENT:?set ENVIRONMENT in .env}
      - SQL_ECHO=${SQL_ECHO:?set SQL_ECHO in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:?}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:?}
      - INVITATION_EXPIRE_DAYS=${INVITATION_EXPIRE_DAYS:?}
      - VISITOR_TOKEN_EXPIRE_DAYS=${VISITOR_TOKEN_EXPIRE_DAYS:?}
      - SESSION_IDLE_TIMEOUT_MINUTES=${SESSION_IDLE_TIMEOUT_MINUTES:?}
      - AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=${AUTH_LOGIN_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_REGISTER_RATE_LIMIT_PER_MINUTE=${AUTH_REGISTER_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_REFRESH_RATE_LIMIT_PER_MINUTE=${AUTH_REFRESH_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_ACCEPT_RATE_LIMIT_PER_MINUTE=${AUTH_ACCEPT_RATE_LIMIT_PER_MINUTE:?}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:?}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:?set COOKIE_SECURE in .env}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:?set COOKIE_SAMESITE in .env}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:?}
      - EMBEDDING_DIM=${EMBEDDING_DIM:?}
      - CHUNK_SIZE=${CHUNK_SIZE:?}
      - CHUNK_MAX_SIZE=${CHUNK_MAX_SIZE:?}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:?}
      - CHUNK_TABLE_CONTEXT=${CHUNK_TABLE_CONTEXT:?}
      - CHUNK_SECTION_CONTEXT=${CHUNK_SECTION_CONTEXT:?}
      - CHUNK_INCLUDE_METADATA=${CHUNK_INCLUDE_METADATA:?}
      - DROP_REPEATED_LAYOUT=${DROP_REPEATED_LAYOUT:?}
      - PARSER_DEBUG=${PARSER_DEBUG:?}
      - MIN_CHARS_PER_PAGE=${MIN_CHARS_PER_PAGE:?}
      - RELEVANCE_THRESHOLD=${RELEVANCE_THRESHOLD:?}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:?}
      - HYBRID_ENABLED=${HYBRID_ENABLED:?}
      - RRF_K=${RRF_K:?}
      - RERANK_ENABLED=${RERANK_ENABLED:?}
      - RERANK_MODEL=${RERANK_MODEL:?}
      - RERANK_CANDIDATES=${RERANK_CANDIDATES:?}
      - RERANK_BATCH_SIZE=${RERANK_BATCH_SIZE:?}
      - RERANK_MODE=${RERANK_MODE:?}
      - CHAT_CONTEXT_K=${CHAT_CONTEXT_K:?}
      - CHAT_HISTORY_LIMIT=${CHAT_HISTORY_LIMIT:?}
      - CHAT_RETENTION_DAYS=${CHAT_RETENTION_DAYS:?}
      - WIDGET_RATE_LIMIT_PER_MINUTE=${WIDGET_RATE_LIMIT_PER_MINUTE:?}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:?}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:?}
      - EXTERNAL_API_ENABLED=${EXTERNAL_API_ENABLED:?}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
      - OCR_ENABLED=${OCR_ENABLED:?}
      - OCR_DPI=${OCR_DPI:?}
      - OCR_MIN_CONFIDENCE=${OCR_MIN_CONFIDENCE:?}
      - OCR_IMAGE_DOMINANCE_RATIO=${OCR_IMAGE_DOMINANCE_RATIO:?}
    ports:
      - "${BACKEND_PORT:?set BACKEND_PORT in .env}:8000"
    volumes:
      - storage_data:/data/storage
      - fastembed_cache:/data/fastembed
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: ./backend
    container_name: jac_rag_worker
    restart: always
    command: taskiq worker app.core.tkq:broker --fs-discover
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:?}:${DB_PASSWORD:?}@db:5432/${DB_NAME:?}
      - DB_POOL_SIZE=${DB_POOL_SIZE:?}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:?}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:?}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/data/storage
      - FASTEMBED_CACHE_PATH=/data/fastembed
      - ENVIRONMENT=${ENVIRONMENT:?set ENVIRONMENT in .env}
      - SQL_ECHO=${SQL_ECHO:?set SQL_ECHO in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:?}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:?}
      - INVITATION_EXPIRE_DAYS=${INVITATION_EXPIRE_DAYS:?}
      - VISITOR_TOKEN_EXPIRE_DAYS=${VISITOR_TOKEN_EXPIRE_DAYS:?}
      - SESSION_IDLE_TIMEOUT_MINUTES=${SESSION_IDLE_TIMEOUT_MINUTES:?}
      - AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=${AUTH_LOGIN_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_REGISTER_RATE_LIMIT_PER_MINUTE=${AUTH_REGISTER_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_REFRESH_RATE_LIMIT_PER_MINUTE=${AUTH_REFRESH_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_ACCEPT_RATE_LIMIT_PER_MINUTE=${AUTH_ACCEPT_RATE_LIMIT_PER_MINUTE:?}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:?}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:?set COOKIE_SECURE in .env}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:?set COOKIE_SAMESITE in .env}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:?}
      - EMBEDDING_DIM=${EMBEDDING_DIM:?}
      - CHUNK_SIZE=${CHUNK_SIZE:?}
      - CHUNK_MAX_SIZE=${CHUNK_MAX_SIZE:?}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:?}
      - CHUNK_TABLE_CONTEXT=${CHUNK_TABLE_CONTEXT:?}
      - CHUNK_SECTION_CONTEXT=${CHUNK_SECTION_CONTEXT:?}
      - CHUNK_INCLUDE_METADATA=${CHUNK_INCLUDE_METADATA:?}
      - DROP_REPEATED_LAYOUT=${DROP_REPEATED_LAYOUT:?}
      - PARSER_DEBUG=${PARSER_DEBUG:?}
      - MIN_CHARS_PER_PAGE=${MIN_CHARS_PER_PAGE:?}
      - RELEVANCE_THRESHOLD=${RELEVANCE_THRESHOLD:?}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:?}
      - HYBRID_ENABLED=${HYBRID_ENABLED:?}
      - RRF_K=${RRF_K:?}
      - RERANK_ENABLED=${RERANK_ENABLED:?}
      - RERANK_MODEL=${RERANK_MODEL:?}
      - RERANK_CANDIDATES=${RERANK_CANDIDATES:?}
      - RERANK_BATCH_SIZE=${RERANK_BATCH_SIZE:?}
      - RERANK_MODE=${RERANK_MODE:?}
      - CHAT_CONTEXT_K=${CHAT_CONTEXT_K:?}
      - CHAT_HISTORY_LIMIT=${CHAT_HISTORY_LIMIT:?}
      - CHAT_RETENTION_DAYS=${CHAT_RETENTION_DAYS:?}
      - WIDGET_RATE_LIMIT_PER_MINUTE=${WIDGET_RATE_LIMIT_PER_MINUTE:?}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:?}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:?}
      - EXTERNAL_API_ENABLED=${EXTERNAL_API_ENABLED:?}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
      - OCR_ENABLED=${OCR_ENABLED:?}
      - OCR_DPI=${OCR_DPI:?}
      - OCR_MIN_CONFIDENCE=${OCR_MIN_CONFIDENCE:?}
      - OCR_IMAGE_DOMINANCE_RATIO=${OCR_IMAGE_DOMINANCE_RATIO:?}
    volumes:
      - storage_data:/data/storage
      - fastembed_cache:/data/fastembed
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  scheduler:
    build: ./backend
    container_name: jac_rag_scheduler
    restart: always
    command: taskiq scheduler app.core.tkq:scheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:?}:${DB_PASSWORD:?}@db:5432/${DB_NAME:?}
      - DB_POOL_SIZE=${DB_POOL_SIZE:?}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:?}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:?}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/data/storage
      - FASTEMBED_CACHE_PATH=/data/fastembed
      - ENVIRONMENT=${ENVIRONMENT:?set ENVIRONMENT in .env}
      - SQL_ECHO=${SQL_ECHO:?set SQL_ECHO in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:?}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:?}
      - INVITATION_EXPIRE_DAYS=${INVITATION_EXPIRE_DAYS:?}
      - VISITOR_TOKEN_EXPIRE_DAYS=${VISITOR_TOKEN_EXPIRE_DAYS:?}
      - SESSION_IDLE_TIMEOUT_MINUTES=${SESSION_IDLE_TIMEOUT_MINUTES:?}
      - AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=${AUTH_LOGIN_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_REGISTER_RATE_LIMIT_PER_MINUTE=${AUTH_REGISTER_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_REFRESH_RATE_LIMIT_PER_MINUTE=${AUTH_REFRESH_RATE_LIMIT_PER_MINUTE:?}
      - AUTH_ACCEPT_RATE_LIMIT_PER_MINUTE=${AUTH_ACCEPT_RATE_LIMIT_PER_MINUTE:?}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:?}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:?set COOKIE_SECURE in .env}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:?set COOKIE_SAMESITE in .env}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:?}
      - EMBEDDING_DIM=${EMBEDDING_DIM:?}
      - CHUNK_SIZE=${CHUNK_SIZE:?}
      - CHUNK_MAX_SIZE=${CHUNK_MAX_SIZE:?}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:?}
      - CHUNK_TABLE_CONTEXT=${CHUNK_TABLE_CONTEXT:?}
      - CHUNK_SECTION_CONTEXT=${CHUNK_SECTION_CONTEXT:?}
      - CHUNK_INCLUDE_METADATA=${CHUNK_INCLUDE_METADATA:?}
      - DROP_REPEATED_LAYOUT=${DROP_REPEATED_LAYOUT:?}
      - PARSER_DEBUG=${PARSER_DEBUG:?}
      - MIN_CHARS_PER_PAGE=${MIN_CHARS_PER_PAGE:?}
      - RELEVANCE_THRESHOLD=${RELEVANCE_THRESHOLD:?}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:?}
      - HYBRID_ENABLED=${HYBRID_ENABLED:?}
      - RRF_K=${RRF_K:?}
      - RERANK_ENABLED=${RERANK_ENABLED:?}
      - RERANK_MODEL=${RERANK_MODEL:?}
      - RERANK_CANDIDATES=${RERANK_CANDIDATES:?}
      - RERANK_BATCH_SIZE=${RERANK_BATCH_SIZE:?}
      - RERANK_MODE=${RERANK_MODE:?}
      - CHAT_CONTEXT_K=${CHAT_CONTEXT_K:?}
      - CHAT_HISTORY_LIMIT=${CHAT_HISTORY_LIMIT:?}
      - CHAT_RETENTION_DAYS=${CHAT_RETENTION_DAYS:?}
      - WIDGET_RATE_LIMIT_PER_MINUTE=${WIDGET_RATE_LIMIT_PER_MINUTE:?}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:?}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:?}
      - EXTERNAL_API_ENABLED=${EXTERNAL_API_ENABLED:?}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
      - OCR_ENABLED=${OCR_ENABLED:?}
      - OCR_DPI=${OCR_DPI:?}
      - OCR_MIN_CONFIDENCE=${OCR_MIN_CONFIDENCE:?}
      - OCR_IMAGE_DOMINANCE_RATIO=${OCR_IMAGE_DOMINANCE_RATIO:?}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8000
        NEXT_PUBLIC_WIDGET_SCRIPT_URL: ${NEXT_PUBLIC_WIDGET_SCRIPT_URL:?set NEXT_PUBLIC_WIDGET_SCRIPT_URL in .env}
        NEXT_PUBLIC_WIDGET_API_URL: ${NEXT_PUBLIC_WIDGET_API_URL:?set NEXT_PUBLIC_WIDGET_API_URL in .env}
    container_name: jac_rag_frontend
    restart: always
    environment:
      - API_PROXY_TARGET=http://backend:8000
    ports:
      - "${FRONTEND_PORT:?set FRONTEND_PORT in .env}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: jac_rag_postgres_volume
  qdrant_data:
    name: jac_rag_qdrant_volume
  redis_data:
    name: jac_rag_redis_volume
  storage_data:
    name: jac_rag_storage_volume
  fastembed_cache:
    name: jac_rag_fastembed_volume
  ollama_data:
    name: jac_rag_ollama_volume
